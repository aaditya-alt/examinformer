<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="rrbMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="rrbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Rim with Train Wheel Teeth -->
  <circle cx="50" cy="50" r="48" fill="#1e293b" stroke="url(#rrbGold)" stroke-width="3" />
  <!-- Inner Maroon Badge -->
  <circle cx="50" cy="50" r="43" fill="url(#rrbMaroon)" stroke="#fde047" stroke-width="1.5" />
  <!-- Wheel Spokes Ring -->
  <circle cx="50" cy="50" r="28" fill="#0f172a" stroke="#ca8a04" stroke-width="1.5" />
  <!-- Steam Engine Silhouette Motif in Center -->
  <path d="M 36,58 L 64,58 L 64,54 L 60,54 L 60,44 L 56,44 L 56,41 L 52,41 L 52,44 L 44,44 L 44,52 L 36,52 Z" fill="#fde047" />
  <!-- Engine Cowcatcher / Pilot -->
  <polygon points="34,58 38,58 36,62" fill="#ca8a04" />
  <!-- Engine Cab Window -->
  <rect x="54" y="46" width="4" height="4" rx="0.5" fill="#1e293b" />
  <!-- Engine Driving Wheels -->
  <circle cx="42" cy="58" r="3.5" fill="#fde047" stroke="#1e293b" stroke-width="1" />
  <circle cx="51" cy="58" r="3.5" fill="#fde047" stroke="#1e293b" stroke-width="1" />
  <circle cx="60" cy="58" r="3.5" fill="#fde047" stroke="#1e293b" stroke-width="1" />
  <!-- Indian Tricolor Ribbon Bar Above Engine -->
  <rect x="36" y="35" width="28" height="2" fill="#ff9933" rx="1" />
  <rect x="36" y="37" width="28" height="2" fill="#ffffff" />
  <rect x="36" y="39" width="28" height="2" fill="#138808" rx="1" />
  <circle cx="50" cy="38" r="0.9" fill="#000088" />
  <!-- Top Arc Text: RAILWAY RECRUITMENT BOARD -->
  <path id="rrbTopArc" d="M 18,50 A 32,32 0 0,1 82,50" fill="none" />
  <text font-family="Arial, sans-serif" font-weight="900" font-size="5.5" fill="#fef08a" letter-spacing="0.5">
    <textPath href="#rrbTopArc" startOffset="50%" text-anchor="middle">
      RAILWAY RECRUITMENT BOARD
    </textPath>
  </text>
  <!-- Bottom Arc Text: INDIAN RAILWAYS -->
  <path id="rrbBottomArc" d="M 82,50 A 32,32 0 0,1 18,50" fill="none" />
  <text font-family="Arial, sans-serif" font-weight="900" font-size="6" fill="#fde047" letter-spacing="1">
    <textPath href="#rrbBottomArc" startOffset="50%" text-anchor="middle">
      INDIAN RAILWAYS
    </textPath>
  </text>
</svg>